# Publishes docs/ to GitHub Pages.
#
# The site now lives in docs/, which IS one of the folders GitHub's simple Pages UI
# offers, so this workflow is no longer strictly required - Settings -> Pages ->
# Source: "Deploy from a branch", branch main, folder /docs would also work.
# It is kept because it deploys on every push without further configuration.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Deploy documentation

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
